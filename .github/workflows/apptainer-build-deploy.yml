name: Apptainer Build Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: Build and Deploy 'Tainer
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      IMAGE: oras://ghcr.io/g5t/stacktainer/splitrun
    steps:
      # Ubuntu 26.04 (ubuntu-latest since November 2026) packages Apptainer.
      # It also stops unprivileged processes creating user namespaces unless an
      # AppArmor profile allows the binary; without that, `apptainer build` fails with
      # "mount namespace requires privileges". The runner is a throwaway VM, so lift
      # the restriction outright.
      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y apptainer
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          apptainer --version

      - name: Check out
        uses: actions/checkout@v6

      - name: Build
        run: apptainer build splitrun.sif image.def

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | apptainer registry login -u "${GITHUB_ACTOR}" --password-stdin oras://ghcr.io
          for tag in "${GITHUB_REF_NAME#v}" latest; do
            apptainer push -U splitrun.sif "${IMAGE}:${tag}"
          done
